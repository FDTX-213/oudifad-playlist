name: Update M3U Playlist

on:
  schedule:
    - cron: "0 6 * * *"   # كل يوم الساعة 6 صباحاً UTC
  workflow_dispatch:       # تشغيل يدوي من الزر

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python build_playlist.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add playlist.m3u
          git diff --staged --quiet || git commit -m "Update playlist $(date -u +%Y-%m-%d)"
          git push
